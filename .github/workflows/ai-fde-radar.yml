name: AI FDE Radar Daily

on:
  schedule:
    # GitHub cron uses UTC: 01:15 UTC = 09:15 Asia/Shanghai.
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate without Feishu delivery or Pages publish
        required: false
        default: false
        type: boolean
      force_send:
        description: Bypass the same-day successful-send guard
        required: false
        default: false
        type: boolean

concurrency:
  group: ai-fde-radar-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Prepare configuration and restore persisted state
        shell: bash
        run: |
          cp data/config.github.json data/config.json
          mkdir -p data/state/sent
          git fetch origin gh-pages --depth=1 || true
          if git show origin/gh-pages:state/seen_items.json > /tmp/seen_items.json 2>/dev/null; then
            mv /tmp/seen_items.json data/state/seen_items.json
          fi
          TODAY="$(TZ=Asia/Shanghai date +%F)"
          if git show "origin/gh-pages:state/sent/${TODAY}.json" > /tmp/sent-marker.json 2>/dev/null; then
            mv /tmp/sent-marker.json "data/state/sent/${TODAY}.json"
          fi

      - name: Generate and deliver radar
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || false }}
        run: |
          args=(--hours 30)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$FORCE_SEND" == "true" ]]; then args+=(--force-send); fi
          for attempt in 1 2; do
            if uv run horizon "${args[@]}"; then
              exit 0
            fi
            if [[ "$attempt" == "1" ]]; then
              echo "Generation failed; retrying once."
              sleep 20
            fi
          done
          exit 1

      - name: Persist deduplication and send state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        run: |
          mkdir -p docs/state
          cp -R data/state/. docs/state/

      - name: Scan public artifacts for secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run python scripts/verify_no_secrets.py docs data/summaries

      - name: Upload dry-run artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-fde-radar-dry-run
          path: |
            data/summaries
            docs/_posts
            docs/metrics
          if-no-files-found: error

      - name: Deploy GitHub Pages
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: true
          commit_message: "AI FDE Radar ${{ github.run_id }}"
